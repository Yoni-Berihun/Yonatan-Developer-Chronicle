# Render Blueprint for The Yonatan Times API (FREE — no credit card).
#
# Apply with: Render Dashboard → New → Blueprint → pick this repo.
# Creates the API + Postgres together and wires DATABASE_URL automatically.
#
# Free limits to know:
# - Web service sleeps after ~15 min idle (first hit can take 30–60s)
# - Free Postgres expires after 30 days (you can recreate, or move to Neon later)
#
# To use paid later: change plan to "starter" (API) and "basic-256mb" (DB).

services:
  - type: web
    name: yonatan-times-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    # --include=dev is required: Render sets NODE_ENV=production, which makes npm
    # skip devDependencies, and the build needs TypeScript to compile.
    buildCommand: npm ci --include=dev && npm run build
    # Migrations run on boot so a schema change ships with its deploy.
    startCommand: npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: yonatan-times-db
          property: connectionString

      # Generated once by Render and kept secret. Rotating it signs you out.
      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 7d

      # --- Set these in the dashboard after the first deploy -----------------

      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false

      - key: PUBLIC_SITE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: CONTACT_NOTIFY_EMAIL
        sync: false

      - key: VERCEL_DEPLOY_HOOK_URL
        sync: false

databases:
  - name: yonatan-times-db
    plan: free
    region: frankfurt
    databaseName: yonatan_times
    user: yonatan
    postgresMajorVersion: "17"

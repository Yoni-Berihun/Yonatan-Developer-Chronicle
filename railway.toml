# Railway config for The Yonatan Times (single service: API + React build).
# Project → New → Deploy from GitHub → select this repo (root directory = /).

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
